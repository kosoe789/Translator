<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer stroke/glow accent -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#475569" stroke-width="4" stroke-opacity="0.3" />

  <!-- Left Card (English 'A') -->
  <g transform="translate(100, 120)">
    <!-- Card Backing -->
    <rect width="180" height="240" rx="24" fill="url(#cardGrad1)" filter="drop-shadow(0px 10px 15px rgba(0, 0, 0, 0.4))" />
    <!-- Character A -->
    <text x="90" y="150" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="110" fill="#ffffff" text-anchor="middle">A</text>
  </g>

  <!-- Right Card (Myanmar 'က') -->
  <g transform="translate(230, 160)">
    <!-- Card Backing -->
    <rect width="180" height="240" rx="24" fill="url(#cardGrad2)" filter="drop-shadow(0px 15px 25px rgba(0, 0, 0, 0.5))" />
    <!-- Character 'က' -->
    <text x="90" y="155" font-family="system-ui, 'Pyidaungsu', 'Myanmar3', sans-serif" font-weight="bold" font-size="110" fill="#ffffff" text-anchor="middle">က</text>
  </g>
  
  <!-- Connecting curved translation arrows with nice double lines -->
  <path d="M 220,105 C 256,70 340,70 376,140" fill="none" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" />
  <polyline points="380,110 380,143 350,138" fill="none" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <path d="M 292,407 C 256,442 172,442 136,372" fill="none" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" />
  <polyline points="132,402 132,369 162,374" fill="none" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
</svg>
